name: Release

# Assembles a release: kernel modules, ksuinit, ksud, the manager APK, then the
# publish step. Each stage is its own workflow so any of them can be dispatched
# alone. All of them write to /ci/runs/<run_id>/<artifact> on the runner host, and
# a stage can reuse an earlier result by dispatching the workflow that needs it
# with artifacts_run=<id>.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      artifacts_run:
        description: 'Reuse ksud/LKM/ksuinit from this run id (empty = build them)'
        required: false
        default: ''
        type: string

jobs:

  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          remote="https://git.zako.shirkneko.top:20004"
          mirror="/ci/repo-cache/${GITHUB_REPOSITORY}.git"
          mkdir -p "$(dirname "$mirror")"
          if [ ! -d "$mirror" ]; then
            # The token must not appear in the trace of `set -x`.
            set +x
            git -c "http.${remote}/.extraHeader=Authorization: token ${TOKEN}" \
              clone -q --mirror "${remote}/${GITHUB_REPOSITORY}.git" "$mirror"
            set -x
          elif command -v flock >/dev/null 2>&1; then
            (
              flock 9
              git --git-dir="$mirror" fetch -q --prune origin \
                "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*" "+refs/pull/*:refs/pull/*"
            ) 9>"${mirror}.lock"
          else
            git --git-dir="$mirror" fetch -q --prune origin \
              "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*" "+refs/pull/*:refs/pull/*"
          fi
          git clone -q --shared --no-checkout "$mirror" .
          git checkout -q "${GITHUB_SHA}"

      - name: Calculate version code
        id: version
        run: |
          set -eux
          COMMIT_COUNT=$(git rev-list --count refs/remotes/origin/main)
          VERSION_CODE=$((30000 + COMMIT_COUNT + 996))
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "KernelSU version code: $VERSION_CODE (main commits: $COMMIT_COUNT)"

  build-lkm:
    needs: [determine-version]
    uses: ./.github/workflows/build-lkm.yml
    with:
      version_code: ${{ needs.determine-version.outputs.version_code }}
      release_build: true

  build-ksuinit:
    uses: ./.github/workflows/ksuinit.yml
    secrets: inherit

  build-builtzygisk:
    uses: ./.github/workflows/builtzygisk.yml
    secrets: inherit

  build-ksud:
    needs: [build-lkm, build-ksuinit, build-builtzygisk]
    uses: ./.github/workflows/ksud.yml
    with:
      pack_lkm: true
      pack_ksuinit: true
      pack_builtzygisk: true
    secrets: inherit

  manager:
    needs: build-ksud
    uses: ./.github/workflows/manager.yml
    with:
      artifacts_run: ''
      release_build: true
    secrets: inherit

  publish:
    needs: manager
    uses: ./.github/workflows/publish.yml
    with:
      release_upload: true
    secrets: inherit

  assemble:
    needs: [build-lkm, build-ksuinit, build-ksud, manager]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          remote="https://git.zako.shirkneko.top:20004"
          mirror="/ci/repo-cache/${GITHUB_REPOSITORY}.git"
          mkdir -p "$(dirname "$mirror")"
          if [ ! -d "$mirror" ]; then
            # The token must not appear in the trace of `set -x`.
            set +x
            git -c "http.${remote}/.extraHeader=Authorization: token ${TOKEN}" \
              clone -q --mirror "${remote}/${GITHUB_REPOSITORY}.git" "$mirror"
            set -x
          elif command -v flock >/dev/null 2>&1; then
            (
              flock 9
              git --git-dir="$mirror" fetch -q --prune origin \
                "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*" "+refs/pull/*:refs/pull/*"
            ) 9>"${mirror}.lock"
          else
            git --git-dir="$mirror" fetch -q --prune origin \
              "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*" "+refs/pull/*:refs/pull/*"
          fi
          git clone -q --shared --no-checkout "$mirror" .
          git checkout -q "${GITHUB_SHA}"

      - name: Provide node and the action sources
        run: |
          set -eux
          # act runs JS actions with `node` from the container PATH, and it would
          # otherwise clone every `uses:` action from data.forgejo.org. Both are
          # pre-seeded in the shared /ci volume, so a job needs no network for
          # either.
          found=
          for dir in /opt/acttoolcache/node/*/x64/bin /ci/tools/node/bin; do
            if [ -x "$dir/node" ]; then
              echo "$dir" >> "$GITHUB_PATH"
              found=1
              break
            fi
          done
          [ -n "$found" ] || { echo "node not found (tool cache and /ci/tools/node)" >&2; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/.ci-actions"
          for action in upload-artifact download-artifact; do
            rm -rf "$GITHUB_WORKSPACE/.ci-actions/$action"
            cp -a "/ci/tools/actions/$action" "$GITHUB_WORKSPACE/.ci-actions/$action"
          done
      - name: Download the build artifacts
        id: download_build
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          . "${GITHUB_WORKSPACE}/.github/scripts/ci/common.sh"
          ci_download_all_artifacts "${GITHUB_WORKSPACE}/artifacts"

      - name: Download the build artifacts (Forgejo fallback)
        if: steps.download_build.outcome == 'failure'
        uses: ./.ci-actions/download-artifact
        with:
          path: artifacts

      - name: Pack the release files
        run: |
          set -eux
          out="$GITHUB_WORKSPACE/release"
          rm -rf "$out"
          mkdir -p "$out" "$out/lkm" "$out/ksud" "$out/ksuinit"

          cp -f artifacts/sukisu-manager/*.apk "$out"/ 2>/dev/null || true

          for d in artifacts/*-android*-lkm; do
            [ -d "$d" ] || continue
            name="$(basename "$d")"
            cp -f "$d"/*_kernelsu.ko "$out/lkm/lkm-${name%-lkm}_kernelsu.ko"
          done

          for d in artifacts/ksud-*; do
            [ -d "$d" ] || continue
            cp -f "$d"/ksud* "$out/ksud/$(basename "$d")" 2>/dev/null || true
          done

          for d in artifacts/ksuinit-*; do
            [ -d "$d" ] || continue
            cp -f "$d"/ksuinit "$out/ksuinit/$(basename "$d")" 2>/dev/null || true
          done

          # Flat release assets: the payload names repeat across architectures,
          # so they are prefixed instead of kept in per-arch directories.
          for d in artifacts/builtzygisk-*; do
            [ -d "$d" ] || continue
            arch="${d##*builtzygisk-}"
            [ -d "$d/$arch" ] && d="$d/$arch"
            for f in "$d"/*; do
              [ -f "$f" ] || continue
              cp -f "$f" "$out/zygisk-${arch}-$(basename "$f")"
            done
          done

          find "$out" -type f | sort
          test -n "$(ls -A "$out")"
          echo "release files collected in ${out}"

      - name: Upload the release bundle
        uses: ./.ci-actions/upload-artifact
        with:
          name: release
          path: release/
          if-no-files-found: error

      - name: Upload release to CNB
        if: github.ref_type == 'tag'
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ vars.CNB_REPO || 'shirkneko/sukisu-result' }}
          CNB_TAG: ${{ github.ref_name }}
          CNB_NAME: ${{ github.ref_name }}
          CNB_ASSETS_DIR: release
          CNB_BODY_FILE: release/notes.md
          CNB_PRERELEASE: "false"
          CNB_MAKE_LATEST: "true"
          CNB_TARGET_COMMITISH: ${{ vars.CNB_TARGET_COMMITISH || 'main' }}
        run: |
          set -eu
          {
            echo "# ${GITHUB_REF_NAME}"
            echo
            echo "Release build for \`${GITHUB_SHA}\`."
            echo
            echo "## Recent changes"
            echo
            git log -30 --format='- %s (`%h`)'
          } > release/notes.md
          bash .github/scripts/ci/cnb-upload.sh

      - name: Store the release bundle for LAN handoff
        run: |
          set -eux
          . "${GITHUB_WORKSPACE}/.github/scripts/ci/common.sh"
          ci_artifact_put release "${GITHUB_WORKSPACE}/release/"

  # A tag push publishes a real release with every artifact attached: the kernel
  # modules, ksud, ksuinit and the manager APK. Without this the release only
  # existed on the runner host.
      - name: Write the job summary
        run: |
          set -eux
          . "${GITHUB_WORKSPACE}/.github/scripts/ci/common.sh"
          ci_summary_artifacts "release"

  publish-release:
    needs: [assemble]
    runs-on: ubuntu-latest
    steps:
      # assemble may have run on another runner, so its output comes from
      # Forgejo rather than the local /ci volume.
      - name: Provide node and the action sources
        run: |
          set -eux
          # act runs JS actions with `node` from the container PATH, and it would
          # otherwise clone every `uses:` action from data.forgejo.org. Both are
          # pre-seeded in the shared /ci volume, so a job needs no network for
          # either.
          found=
          for dir in /opt/acttoolcache/node/*/x64/bin /ci/tools/node/bin; do
            if [ -x "$dir/node" ]; then
              echo "$dir" >> "$GITHUB_PATH"
              found=1
              break
            fi
          done
          [ -n "$found" ] || { echo "node not found (tool cache and /ci/tools/node)" >&2; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/.ci-actions"
          for action in upload-artifact download-artifact; do
            rm -rf "$GITHUB_WORKSPACE/.ci-actions/$action"
            cp -a "/ci/tools/actions/$action" "$GITHUB_WORKSPACE/.ci-actions/$action"
          done
      - name: Download the release bundle
        id: download_release
        if: github.ref_type == 'tag'
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          . "${GITHUB_WORKSPACE}/.github/scripts/ci/common.sh"
          ci_download_artifact release "${GITHUB_WORKSPACE}/release"

      - name: Download the release bundle (Forgejo fallback)
        if: github.ref_type == 'tag' && steps.download_release.outcome == 'failure'
        uses: ./.ci-actions/download-artifact
        with:
          name: release
          path: release

      - name: Upload the release assets
        if: github.ref_type == 'tag'
        env:
          # Dedicated token with write:repository. The built-in GITHUB_TOKEN is
          # only a fallback: it may lack release permissions on this instance.
          API_TOKEN: ${{ secrets.RELEASE_API_TOKEN || vars.RELEASE_API_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # No checkout here: the assets come from the `release` artifact that
          # assemble published, so common.sh is not available and not needed.
          site="${FORGEJO_PUBLIC_URL:-https://git.zako.shirkneko.top:20004}"
          api="${site}/api/v1/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: token ${API_TOKEN}"
          tag="${GITHUB_REF_NAME}"
          dir="${GITHUB_WORKSPACE}/release"
          test -d "$dir"
          echo "publishing ${tag} from ${dir}"

          net() {
            curl -sS --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 10 --max-time 300 "$@"
          }
          net_once() {
            curl -sS --retry 5 --retry-connrefused --retry-delay 2 \
              --connect-timeout 10 --max-time 300 "$@"
          }

          release="$api/releases/tags/$tag"
          status="$(net -o /tmp/release.json -w '%{http_code}' -H "$auth" "$release" || true)"
          if [ "$status" = "200" ]; then
            id="$(jq -r '.id' /tmp/release.json)"
            echo "existing release id=${id}"
          else
            payload="$(jq -nc --arg tag "$tag" --arg sha "$GITHUB_SHA" \
              '{tag_name: $tag, target_commitish: $sha, name: $tag, prerelease: false,
                body: "Release assets built by CI."}')"
            net_once -X POST -H "$auth" -H 'Content-Type: application/json' \
              -d "$payload" "$api/releases" >/dev/null
            net -H "$auth" "$release" -o /tmp/release.json
            id="$(jq -r '.id' /tmp/release.json)"
            echo "created release id=${id}"
          fi
          test -n "$id" && [ "$id" != "null" ]

          # Re-runs replace the previous assets instead of piling up duplicates.
          for asset_id in $(jq -r '.assets[].id' /tmp/release.json); do
            net -X DELETE -H "$auth" "$api/releases/${id}/assets/$asset_id" >/dev/null
          done

          # Flat asset names: lkm-<kmi>_kernelsu.ko, ksud-<triple>,
          # ksuinit-<arch> and the manager APK are already unique.
          find "$dir" -type f | sort | while read -r f; do
            name="$(basename "$f")"
            net_once -f -X POST -H "$auth" -F "attachment=@${f}" \
              "$api/releases/${id}/assets?name=${name}" >/dev/null
            echo "uploaded ${name}"
          done
          echo "release ${tag} updated"
